<!doctype html>
<html lang="en"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Melodia | Dashboard</title><link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin /><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet" /><link rel="stylesheet" href="./styles.css" /></head>
<body><a class="skip" href="#main">Skip to content</a><div id="siteHeader"></div>
<main id="main"><section class="page-hero"><p class="eyebrow">Student dashboard</p><h1 id="welcome">Welcome</h1></section>
<section class="split"><div class="card"><h3>Upcoming lessons</h3><div id="upcoming"></div></div><div class="card"><h3>Payment history</h3><p>No payments yet. Payments will appear here once checkout is connected.</p></div></section>

<div id="siteFooter"></div>
<script src="./scripts/teachers-data.js"></script><script src="./scripts/teachers.js"></script>
<script>(function(){var u=JSON.parse(localStorage.getItem("melodiaUser")||"null");document.getElementById("welcome").textContent="Welcome"+(u?", "+u.name:"");var b=[];try{b=JSON.parse(localStorage.getItem("melodia_demo_bookings")||"[]")}catch(e){}var el=document.getElementById("upcoming");el.innerHTML=b.length?b.map(function(x){var t=TEACHERS.find(function(y){return y.id===x.teacherId});return "<p><strong>"+t.name+"</strong><br>"+new Date(x.start).toLocaleString("en-KE",{weekday:"short",day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})+" · "+x.format+" · awaiting payment</p>"}).join(""):"<p>No lessons yet.</p><a class=\"primary-action\" href=\"./teachers.html\">Find a teacher</a>"})()</script>
<script src="./scripts/site.js"></script>
</body></html>
