<!doctype html>
<html lang="en"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Melodia | Find a Teacher</title><link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin /><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet" /><link rel="stylesheet" href="./styles.css" /></head>
<body><a class="skip" href="#main">Skip to content</a><div id="siteHeader"></div>
<main id="main"><section class="page-hero"><p class="eyebrow">Human teachers</p><h1>Find the right teacher for you.</h1><p>Compare friendly teachers by instrument, format, price and rating. Demo data shown for preview.</p></section><section><div class="filters card" role="search"><label>Search<input id="fq" type="search" placeholder="Name or instrument" /></label><label>Instrument<select id="finst"><option value="">Any</option><option>Piano</option><option>Guitar</option><option>Voice</option><option>Violin</option><option>Drums</option><option>Music Theory</option></select></label><label>Format<select id="ffmt"><option value="">Any</option><option>Online</option><option>In person</option></select></label><label>Max price<select id="fprice"><option value="">Any</option><option value="1500">KSh 1,500</option><option value="1800">KSh 1,800</option><option value="2000">KSh 2,000</option></select></label><label>Rating<select id="frate"><option value="">Any</option><option value="4.5">4.5+</option><option value="4.8">4.8+</option></select></label><label>Sort<select id="fsort"><option value="rec">Recommended</option><option value="price">Price</option><option value="rating">Rating</option></select></label></div><p id="resultCount" role="status"></p><div class="teacher-market" id="teacherList"></div><div class="pager" id="pager"></div></section></main>
<div id="siteFooter"></div>
<script src="./scripts/teachers-data.js"></script><script src="./scripts/teachers.js"></script>
<script src="./scripts/site.js"></script>
</body></html>
